name: CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: python -m pytest tests/ -q

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Core benchmark smoke (math suite + red-team)
        run: |
          python -c "from octo_core.evaluation import BenchmarkSuite; r = BenchmarkSuite().math_benchmark(); assert r['score'] == 1.0, r; print('math suite:', r)"
          python -c "from octo_core.evolution import RedTeamSuite; from octo_core.security import detect_prompt_injection; r = RedTeamSuite().run(lambda t: detect_prompt_injection(t)[0] != 'none'); assert r['pass_rate'] >= 0.9, r; print('red-team:', r)"
