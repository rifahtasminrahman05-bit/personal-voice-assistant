name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main, "vibe/**"]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy pyinstaller
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build macOS .app
        run: python build_desktop.py
      - name: Zip app bundle
        run: |
          cd dist
          zip -qry OctoDesktop-macOS.zip OctoDesktop.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoDesktop-macOS
          path: dist/OctoDesktop-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install numpy pyinstaller
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Build Windows exe
        run: python build_desktop.py
      - name: Zip dist folder
        run: Compress-Archive -Path dist/OctoDesktop -DestinationPath OctoDesktop-windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoDesktop-windows
          path: OctoDesktop-windows.zip
